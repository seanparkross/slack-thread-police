services:
  thread-police:
    build: .
    image: slack-thread-police
    env_file: .env
    restart: unless-stopped
    init: true
    volumes:
      # Keeps /threadpolice opt-outs and snoozes (user ids) and nudge counts (channel ids) across restarts; no messages.
      - thread-police-data:/app/data

volumes:
  thread-police-data:
